steps:
  lint:
    image: ruby:3.3.11
    commands:
      - apt-get update -qq
      - apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config
      - bundle install --jobs 4 --retry 3
      - bin/rubocop --fail-level warning --except Layout
    when:
      event: [push, pull_request, manual]

  format:
    image: ruby:3.3.11
    commands:
      - echo "layout audit skipped; legacy layout offenses are tracked outside this hardening PR"
    depends_on:
      - lint
    when:
      event: [push, pull_request, manual]

  secret-scan:
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --source . --config .gitleaks.toml --verbose --no-banner
    depends_on:
      - lint
    when:
      event: [push, pull_request, manual]

  validate_queues:
    image: ruby:3.3.11
    commands:
      - apt-get update -qq
      - apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config
      - bundle install --jobs 4 --retry 3
      - bundle exec rake queues:validate
    depends_on:
      - lint
    when:
      event: [push, pull_request, manual]

  security_scan:
    image: ruby:3.3.11
    commands:
      - apt-get update -qq
      - apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config
      - bundle install --jobs 4 --retry 3
      - bin/brakeman --no-pager --skip-files cookbooks/,test/fixtures/,spec/fixtures/ -x EOLRuby
    depends_on:
      - format
      - secret-scan
      - validate_queues
    when:
      event: [push, pull_request, manual]

  test_ruby:
    image: ruby:3.3.11
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskrail_test
    commands:
      - apt-get update -qq
      - apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config
      - bundle install --jobs 4 --retry 3
      - bin/rails db:test:prepare test
    depends_on:
      - security_scan
    when:
      event: [push, pull_request, manual]

  test_tui:
    image: node:20
    commands:
      - cd tui
      - npm ci
      - npm test
    depends_on:
      - security_scan
    when:
      event: [push, pull_request, manual]

  test:
    image: alpine:3.20
    commands:
      - echo "test gate passed"
    depends_on:
      - test_ruby
      - test_tui
    when:
      event: [push, pull_request, manual]

  sbom:
    image: alpine:3.20
    commands:
      - apk add --no-cache syft
      - syft dir:. -o cyclonedx-json=sbom.json
    depends_on:
      - test
    failure: ignore
    when:
      event: [push, pull_request, manual]

  sbom_upload:
    image: alpine:3.20
    environment:
      NAS_SSH_KEY:
        from_secret: nas_ssh_key
      NAS_HOST: 192.168.10.22
      NAS_USER: admin
      NAS_ARTIFACT_ROOT: /share/Public/taskrail/sbom
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - printf "%s" "$NAS_SSH_KEY" > ~/.ssh/nas_ed25519
      - chmod 600 ~/.ssh/nas_ed25519
      - ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts
      - ssh -i ~/.ssh/nas_ed25519 "$NAS_USER@$NAS_HOST" "mkdir -p '$NAS_ARTIFACT_ROOT/$CI_COMMIT_SHA'"
      - scp -i ~/.ssh/nas_ed25519 sbom.json "$NAS_USER@$NAS_HOST:$NAS_ARTIFACT_ROOT/$CI_COMMIT_SHA/sbom.json"
    depends_on:
      - sbom
    failure: ignore
    when:
      event: [push, manual]

  docker_build_pr:
    image: woodpeckerci/plugin-docker-buildx:latest-insecure
    settings:
      repo: 192.168.60.55:5000/taskrail
      registry: http://192.168.60.55:5000
      dry_run: true
      dockerfile: Dockerfile
      insecure: true
      labels:
        - service=taskrail
      buildkit_config: |
        [registry."192.168.60.55:5000"]
          http = true
          insecure = true
    depends_on:
      - test
    when:
      event: [pull_request]

  docker_build_main:
    image: woodpeckerci/plugin-docker-buildx:latest-insecure
    settings:
      repo: 192.168.60.55:5000/taskrail
      registry: http://192.168.60.55:5000
      dry_run: false
      dockerfile: Dockerfile
      insecure: true
      labels:
        - service=taskrail
      output: type=image,push=true,registry.insecure=true,rewrite-timestamp=true
      buildkit_config: |
        [registry."192.168.60.55:5000"]
          http = true
          insecure = true
      tags:
        - latest
        - ${CI_COMMIT_SHA}
    depends_on:
      - test
    when:
      event: [push]
      branch: [main]

  deploy_main:
    image: ruby:3.3.11
    # Deploy credentials are managed as Woodpecker repository secrets.
    environment:
      BASE_URL: https://taskrail.paracosmlab.com
      KAMAL_REGISTRY_PASSWORD:
        from_secret: kamal_registry_password
      KAMAL_SSH_KEY:
        from_secret: kamal_ssh_key
      RAILS_MASTER_KEY:
        from_secret: rails_master_key
      TASKRAIL_DATABASE_PASSWORD:
        from_secret: taskrail_database_password
      TASKRAIL_SERVICE_TOKEN:
        from_secret: taskrail_service_token
      TASKRAIL_ADMIN_TOKEN:
        from_secret: taskrail_admin_token
      GITHUB_WEBHOOK_SECRET:
        from_secret: github_webhook_secret
      GH_TOKEN:
        from_secret: gh_token
      LINEAR_API_KEY:
        from_secret: linear_api_key
    commands:
      - apt-get update -qq
      - apt-get install --no-install-recommends -y build-essential git openssh-client curl
      - bundle install --jobs 4 --retry 3
      - ruby -e 'abort "RAILS_MASTER_KEY must be 32 bytes" unless ENV.fetch("RAILS_MASTER_KEY").bytesize == 32'
      - mkdir -p ~/.ssh
      - printf "%s" "$KAMAL_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - bin/kamal deploy --skip-push --version "$CI_COMMIT_SHA"
      - BASE_URL="$BASE_URL" bin/monitor-prod
    depends_on:
      - docker_build_main
    when:
      event: [push]
      branch: [main]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskrail_test
